<style>
/* Layout: one screen, no page scroll — the music stand (live staff) fills the top, the Pa700 OR panel and keys sit right under it, so eyes move between notes and keys without scrolling. Works portrait and landscape. */
:root{
  --ground:#e7ebef; --ink:#16202a; --muted:#5a6773; --line:#cfd6dd;
  --paper:#fbfaf7; --paper-ink:#1d1d1d; --stand:#2a2f36;
  --body:#1b232c; --body-edge:#0e1419; --panel-ink:#cdd7e0; --panel-dim:#7f8e9b;
  --ivory:#f2eee6; --ivory-shade:#d9d3c6; --ebony:#0e0f11;
  --led:#ffb347; --violet:#8b5cf6; --copper:#c27c3a; --led-off:#3a2f22; --go:#2fbf71; --stop:#e0483e;
  --screen:#0d2233; --screen-hi:#15344d; --screen-ink:#dff3ff; --screen-dim:#7fb3d1;
  --brass:#a8691c; --turq:#0f7f7b;
  --kh:clamp(96px,19vh,165px);
  --f-display:"Reem Kufi","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ground:#0e1318; --ink:#e3e9ef; --muted:#93a1ad; --line:#26313b; --brass:#dca052; --stand:#1b2027; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --ground:#0e1318; --ink:#e3e9ef; --muted:#93a1ad; --line:#26313b; --brass:#dca052; --stand:#1b2027; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;overflow:hidden}
.app{height:100%;max-width:1100px;margin:0 auto;padding-inline:max(10px,env(safe-area-inset-left,0px)) max(10px,env(safe-area-inset-right,0px));padding-block:8px;display:flex;flex-direction:column;gap:6px}
button,select{font:inherit;cursor:pointer}
button:focus-visible,select:focus-visible{outline:2px solid var(--led);outline-offset:2px}

/* Music stand */
.stand{flex:1 1 auto;min-height:120px;background:var(--stand);border-radius:10px;padding:6px;display:flex;flex-direction:column;gap:6px}
.standbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.standbar select{flex:1 1 150px}
.status:empty{display:none}
.standbar select{flex:1 1 auto;min-width:0;background:#1b2027;color:#e3e9ef;border:1px solid #3c4650;border-radius:8px;padding:4px 8px;min-height:36px}
.folders{flex:none;display:flex;border:1px solid #3c4650;border-radius:8px;overflow:hidden}
.folders button{background:#1b2027;color:#aeb9c3;border:none;padding:4px 10px;min-height:36px;font-size:13px;white-space:nowrap}
.folders button.on{background:var(--led);color:#231503;font-weight:600}
#fRec{color:#c9b8ff}
.folders button#fRec.on{background:var(--violet);color:#fff;font-weight:600}
#fDrum{color:#f0c79a}
.folders button#fDrum.on{background:var(--copper);color:#fff;font-weight:600}
.recbar,.drumbar,.editbar,.standbar{flex:none}
.drumbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:#2c1f14;border:1px solid #7a5131;border-radius:6px;padding:4px 8px;color:#f3dcc4;font-size:12px}
.drumbar .dgroup{display:flex;gap:4px}
.drumbar button{background:#3d2a1a;color:#fff;border:1px solid #8a5d39;border-radius:6px;min-width:40px;padding:3px 10px;font-size:15px;line-height:1.2}
.drumbar button.dk{font-weight:700;min-width:52px}
.drumbar button.dk.dum{background:var(--copper);border-color:#e09a5a}
.drumbar button.dk.rest{font-weight:400;font-size:13px}
.drumbar #drDurs button{font-size:20px;padding:0 8px;min-width:36px}
.drumbar button.on{background:#f0c79a;color:#2c1f14;border-color:#f0c79a}
.drumbar button:active{transform:scale(.96)}
.drhint{color:#c9a98a;font-size:11px;flex:1 1 200px}
.newpage{flex:none;background:var(--violet);color:#fff;border:none;border-radius:8px;padding:4px 12px;font-weight:600;min-height:36px;white-space:nowrap}
.newpage:hover{background:#9b72ff}
.attach .sm,.newpage .sm{display:none}
.recmore{display:none!important;flex:none;background:var(--violet);color:#fff;border:none;border-radius:8px;padding:0 10px;min-height:30px;font-size:16px;line-height:1}
@media (max-width:760px) and (orientation:portrait){
  .stand{min-height:300px}
  .drhint{display:none} .drumbar{flex-wrap:nowrap;overflow-x:auto;gap:5px;padding:3px 5px} .drumbar button{min-width:30px;padding:2px 6px;font-size:13px} .drumbar button.dk{min-width:38px} .drumbar #drDurs button{font-size:17px;padding:0 5px;min-width:28px}
  .fx{gap:2px 2px} .fx .fxb{padding:0 3px;font-size:8.5px;letter-spacing:-.02em} .fx .fxb:nth-child(3),.fx .fxb:nth-child(7){margin-left:3px}
  .attach .lg,.newpage .lg{display:none} .attach .sm,.newpage .sm{display:inline}
  .sheetbtn.wago .lg{display:none}
  .attach,.newpage,.editbtn,.sheetbtn{padding-inline:9px}
  .status{flex-basis:100%;order:9}
  .recbar label,.rechint{display:none}
  .recbar{padding:3px 6px}
}
@media (max-height:500px) and (orientation:landscape){
  .recmore:not([hidden]){display:inline-block!important}
  .drhint{display:none} .drumbar{flex-wrap:nowrap;overflow-x:auto;padding:1px 5px;gap:4px} .drumbar button{padding:0 6px;font-size:13px;min-width:30px}
  .status{display:none} .search{min-width:70px;flex:1 1 90px} .standbar select{flex:1 1 100px;min-width:0}
  .recbar label,.rechint{display:none}
  .stand:not(.recopen) .recbar{display:none} .recmore:not([hidden]){display:inline-block}
  .recbar{padding:1px 6px;gap:4px} .recbar button,.recbar input{padding:0 8px;font-size:12px;min-height:0;height:24px}
  .stand{gap:4px;padding:4px} .standbar{gap:4px}
  .attach .lg,.newpage .lg{display:none} .attach .sm,.newpage .sm{display:inline}
}
.recbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:#261d40;border:1px solid #4b3a86;border-radius:6px;padding:4px 8px;color:#e4dcff;font-size:12px}
.recbar input{background:#14101f;color:#fff;border:1px solid #6d5bb0;border-radius:6px;padding:3px 8px;font-size:13px;min-width:0;flex:1 1 140px;max-width:260px}
.recbar button{background:#3b2d66;color:#fff;border:1px solid #6d5bb0;border-radius:6px;padding:3px 10px;font-size:13px}
.recbar button:disabled{opacity:.4}
.recbar button.pdfbtn{background:#e2c98f;border-color:#e2c98f;color:#2a1d05;font-weight:600}
.recbar button.warn{background:#e0483e;border-color:#e0483e}
.recbar button.impbtn{background:#7c4dff;border-color:#9b72ff;font-weight:600}
.impbar{flex:none;display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:#1d2a3a;border:1px solid #3b5a7c;border-radius:6px;padding:5px 8px;color:#dbe8f5;font-size:12px;margin-top:4px}
.impbar[hidden]{display:none}
.impbar b{font-size:13px;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.impbar .imdur{color:#8fb0d0;font-family:var(--f-mono)}
.impbar button{background:#2b4260;color:#fff;border:1px solid #4d7199;border-radius:6px;padding:3px 10px;font-size:13px;cursor:pointer}
.impbar button:disabled{opacity:.45;cursor:default}
.impbar button.go{background:#e2c98f;border-color:#e2c98f;color:#2a1d05;font-weight:700;font-family:var(--f-mono);letter-spacing:.03em}
.impbar label{display:inline-flex;align-items:center;gap:4px;font-family:var(--f-mono)}
.impbar input{width:62px;background:#0f1824;color:#fff;border:1px solid #4d7199;border-radius:6px;padding:3px 6px;font-size:13px;font-family:var(--f-mono)}
.impbar .immsg{flex:1 1 160px;color:#bcd3ea}
.impbar .x{margin-inline-start:auto;background:transparent;border-color:transparent;color:#8fb0d0}
.impbar progress{width:90px;height:8px;accent-color:#e2c98f}
html.st-in .impbar, html.st-guest .impbar, html.st-in #solOpt{display:none!important}
.rechint{color:#b9aee0;font-size:11px}
#recBtn{background:linear-gradient(180deg,#8b5cf6,#6a3fd6);border-color:#a78bfa;color:#fff;margin-inline-start:6px}
#recBtn:hover{background:linear-gradient(180deg,#9b72ff,#7748e6)}
#recBtn span{font-weight:600}
#recBtn i{background:#35245f}
#recBtn.rec i{background:#ff3b30;box-shadow:0 0 10px #ff3b30;animation:recblink 1s steps(2) infinite}
@keyframes recblink{50%{opacity:.3}}
.sheetbtn{flex:none;display:inline-flex;align-items:center;gap:5px;border-radius:8px;padding:4px 11px;min-height:36px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid transparent}
.sheetbtn.pdfgo{background:#e2c98f;border-color:#e2c98f;color:#2a1d05;font-family:var(--f-mono);letter-spacing:.04em}
.sheetbtn.pdfgo:hover{background:#ecd7a6}
.sheetbtn.wago{padding-inline:9px;background:#1f9d55;border-color:#1f9d55;color:#fff}
.sheetbtn.wago:hover{background:#25b863}
.sheetbtn:disabled{opacity:.5;cursor:default}
.sheetbtn .sm{display:none}
.editbtn{flex:none;background:#26303b;color:#e3e9ef;border:1px solid #3c4650;border-radius:8px;padding:4px 12px;min-height:36px;font-family:var(--f-mono);font-size:12px;letter-spacing:.08em}
.editbtn.on{background:#e0483e;border-color:#e0483e;color:#fff}
.stand.editing{box-shadow:0 0 0 3px #e0483e}
.editbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:#3a1f1c;border-radius:6px;padding:4px 8px;color:#ffd6d2;font-size:12px}
.editbar button{background:#26303b;color:#fff;border:1px solid #4b5a68;border-radius:6px;padding:3px 10px;font-size:13px}
.editbar button:disabled{opacity:.4}
.editbar kbd{font-family:var(--f-mono);font-size:10px;opacity:.7}
.edhint{color:#ffb4ab}
.palette{position:fixed;z-index:50;width:min(340px,calc(100vw - 16px));max-height:calc(100vh - 16px);overflow:auto;background:#121a22;color:#e3e9ef;border:1px solid #4b5a68;border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:7px;box-shadow:0 12px 30px rgba(0,0,0,.5);font-size:13px}
.palette .prow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.palette .prow b{flex:1}
.palette .plabel{font-size:11px;color:#7fb3d1}
.palette .pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.palette .pgrid.notes{grid-template-columns:repeat(7,1fr)}
.palette button{background:#1f2a35;color:#e3e9ef;border:1px solid #3c4a58;border-radius:6px;padding:4px 6px;font-size:12px;display:flex;align-items:center;justify-content:center;gap:5px}
.palette button.on{background:var(--led);color:#231503;border-color:var(--led)}
.palette .gl{font-size:18px;line-height:1}
.palette .ppreview{background:#0d2233;border-radius:6px;padding:5px 8px;color:#dff3ff;font-size:14px}
.palette .acts button{flex:1}
.palette .pmain{background:#2fbf71;color:#08210f;border-color:#2fbf71;font-weight:600}
.attach{flex:none;background:var(--led);color:#231503;border:none;border-radius:8px;padding:4px 12px;font-weight:600;min-height:36px;white-space:nowrap}
#file{display:none}
.status{flex:1 1 0;min-width:0;font-size:12px;color:#aeb9c3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.status.err{color:#ff8a80}
.status button{background:none;border:none;color:var(--led);text-decoration:underline;padding:0 4px;font-size:12px}
.paper{position:relative;flex:1 1 auto;min-height:0;background:var(--paper);color:var(--paper-ink);border-radius:3px;overflow:auto;scrollbar-gutter:stable}
.sheet-note{font-size:13px;color:#6b5a48;text-align:center;padding:2px 14px 0;max-width:760px;margin:0 auto;line-height:1.5}
.sheet-title{font-family:var(--f-display);font-size:16px;text-align:center;padding-top:4px;color:var(--paper-ink)}
#score{direction:ltr;padding:14px 6px 8px;width:100%;overflow:hidden}
#score svg{display:block}
#score .vf-stavenote{cursor:pointer}
#score .vf-stavenote.playing path,#score .vf-stavenote.playing text{fill:var(--brass);stroke:var(--brass)}
#score .vf-stavenote.start > .vf-note path{fill:var(--turq);stroke:var(--turq)}
.marquee{position:absolute;z-index:5;border:1.5px dashed #1565c0;background:rgba(21,101,192,.12);border-radius:3px;pointer-events:none}
#score svg{user-select:none}
#score .vf-stavenote.sel path,#score .vf-stavenote.sel text{fill:#1565c0;stroke:#1565c0}
#score svg{user-select:none;-webkit-user-select:none;touch-action:manipulation}
.warns{margin:0;padding:4px 10px 8px 10px;padding-inline-start:26px;color:#6b5a3a;font-size:13px;direction:rtl}
.warns:empty{display:none}

/* Organ */
.organ{flex:none;background:linear-gradient(180deg,var(--body),var(--body-edge));border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:8px;color:var(--panel-ink);box-shadow:0 8px 24px rgba(0,0,0,.2)}
.panel{display:flex;gap:10px;align-items:flex-start}
.lbl{font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;color:var(--panel-dim);text-transform:uppercase}
.scale{flex:none;display:flex;flex-direction:column;gap:4px;align-items:stretch;padding:5px 6px;border:1px solid #2c3845;border-radius:8px}
.scalehead{display:flex;justify-content:space-between;align-items:center;gap:6px}
.mini{position:relative;width:196px;height:74px;direction:ltr;align-self:center}
.mk{position:absolute;border-radius:0 0 4px 4px;border:none;padding:0 0 4px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px;font-size:10px}
.mk.w{width:27px;height:74px;background:var(--ivory);color:#5d574c;top:0}
.mk.b{width:20px;height:42px;background:var(--ebony);color:#9aa4ad;top:0;z-index:2;box-shadow:0 2px 2px rgba(0,0,0,.5)}
.mk i{width:7px;height:7px;border-radius:50%;background:var(--led-off);box-shadow:inset 0 1px 1px rgba(0,0,0,.6)}
.mk.on i{background:var(--led);box-shadow:0 0 6px var(--led)}
.mk.on.w{background:#ffe7c2}
.mk.flash i{background:#fff;box-shadow:0 0 8px #fff}
.small-btn{background:#2b3744;border:1px solid #3c4a58;color:var(--panel-ink);border-radius:6px;font-size:11px;padding:1px 8px}

.center{position:relative;flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:6px}
.snd{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:4px;color:var(--screen-ink);font:inherit;font-size:11px;padding:0 6px;cursor:pointer}
.snd:hover{background:rgba(255,255,255,.16)}
.tune{color:var(--screen-dim)}
.pop.sndpop{top:30px;bottom:auto;inset-inline-start:auto;inset-inline-end:8px;min-width:240px;padding:6px;gap:2px}
.pop.sndpop{max-height:min(70vh,460px);overflow-y:auto;display:grid;grid-template-columns:1fr 1fr;min-width:430px}
.sndpop .popsep{grid-column:1/-1}
@media (max-width:520px){.pop.sndpop{grid-template-columns:1fr;min-width:240px}}
.popsep{font-size:11px;color:#7fb3d1;padding:6px 10px 2px;border-top:1px solid #2c3845;margin-top:4px}
.sndpop button{display:flex;justify-content:space-between;gap:12px;align-items:center;background:none;border:none;color:#e3e9ef;padding:7px 10px;border-radius:6px;text-align:start;font-size:14px}
.sndpop button span{font-family:var(--f-mono);font-size:11px;color:#7fb3d1;direction:ltr}
.sndpop button:hover{background:#1f2b36}
.sndpop button.on{background:var(--led);color:#231503}
.sndpop button.on span{color:#231503}
.pophint{font-size:11px;color:#7f8e9b;margin-top:-4px}
.nowrow{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0}
.fx{display:grid;grid-template-columns:repeat(4,auto);gap:3px 4px;flex:none;direction:ltr}
.fx .fxb:nth-child(3),.fx .fxb:nth-child(7){margin-left:6px}
.fxb.rel{background:rgba(160,230,200,.12);border-color:#5fc8a0;color:#bff0dc}
.fxb{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.18);color:var(--screen-dim);border-radius:4px;font-family:var(--f-mono);font-size:10px;padding:1px 6px;cursor:pointer;white-space:nowrap}
.fxb.on{background:rgba(255,179,71,.18);border-color:var(--led);color:#ffd9a3}
.pop.fxpop{top:30px;bottom:auto;inset-inline-start:8px;min-width:250px}
.sw{display:flex;align-items:center;gap:6px}
.fxsep{width:1px;background:rgba(255,255,255,.2);margin:0 2px}
.fxb.on.blue{background:rgba(111,152,245,.2);border-color:#6f98f5;color:#cfe0ff}
/* the screen is as tall as the Arabic Scale block */
.screen{height:104px;overflow:hidden;min-width:0;background:linear-gradient(180deg,var(--screen-hi),var(--screen));border:4px solid #05080b;border-radius:6px;padding:4px 10px;display:flex;flex-direction:column;justify-content:center;gap:1px;color:var(--screen-ink)}
.screen .top{display:flex;justify-content:space-between;gap:8px;font-family:var(--f-mono);font-size:11px;color:var(--screen-dim);direction:ltr;white-space:nowrap}
.screen .top b{color:#fff;font-weight:600}
#scrMeta{color:var(--led)}
.screen .now{font-size:22px;font-weight:600;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.screen .sub{font-size:12px;color:var(--screen-dim);min-height:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.screen .slow{font-size:12px;color:var(--led);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.screen .slow:empty{display:none}

.ctrl{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.hwbtn{min-height:38px;border-radius:7px;border:1px solid #3c4a58;background:#26303b;color:#fff;display:flex;flex-direction:row;align-items:center;justify-content:center;gap:6px;font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;padding:3px 8px;white-space:nowrap}
.hwbtn i{width:6px;height:16px;border-radius:3px;background:#3b2320;flex:none}
.hwbtn.big{padding-inline:14px}
.hwbtn.run i,.hwbtn.on i{background:var(--go);box-shadow:0 0 8px var(--go)}
.hwbtn.l1 i{background:var(--led);box-shadow:0 0 6px var(--led)}
.hwbtn.l2 i{background:var(--stop);box-shadow:0 0 8px var(--stop)}
.hwbtn.beat i{background:#fff;box-shadow:0 0 10px #fff}
.hwbtn span{font-family:var(--f-body);font-size:12px;letter-spacing:0}
#play{background:linear-gradient(180deg,#c43a31,#94251f);border-color:#d9574c;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 1px 3px rgba(0,0,0,.35)}
#play:hover{background:linear-gradient(180deg,#d2433a,#a12a23)}
#play i{background:#5a1612}
#play.run i{background:#fff;box-shadow:0 0 8px #fff}
#solBtn{background:linear-gradient(180deg,#1f8f86,#14665f);border-color:#2fb3a7;color:#fff;font-weight:700;letter-spacing:.04em;box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 1px 3px rgba(0,0,0,.35)}
#solBtn:hover{background:linear-gradient(180deg,#25a398,#18756d)}
#solBtn i{background:#0b3d39}
#solBtn.run i{background:#fff;box-shadow:0 0 8px #fff}
#solOpt.on{background:#14665f;border-color:#2fb3a7}
.solpop{min-width:300px}
.solpop .solopt{display:flex;gap:8px;align-items:center;cursor:pointer}
.solsyl{display:flex;flex-wrap:wrap;gap:4px}
.solsyl button{background:#1d2a33;color:#dbe8f5;border:1px solid #33505f;border-radius:6px;padding:3px 8px;font-size:13px}
.solsyl button:disabled{opacity:.4}
#midiBtn{background:var(--led);border-color:#e09a35;color:#231503;font-weight:600}
#midiBtn:hover{background:#ffc066}
#midiBtn span{font-weight:600}
#midiBtn i{background:#7a4b12}
#midiBtn.rx i{background:#fff!important;box-shadow:0 0 10px #fff!important}
#midiBtn.l1 i{background:var(--go);box-shadow:0 0 8px var(--go)}
.hwbtn.gear{padding:3px 8px;font-size:15px}
.tempo{display:flex;align-items:center;gap:4px}
.tempos{display:flex;gap:10px;flex-wrap:nowrap;align-items:center}
.tempos .hwbtn{margin-inline:6px}
.tempo button{user-select:none;-webkit-user-select:none;touch-action:manipulation;-webkit-touch-callout:none;width:34px;height:34px;border-radius:6px;border:1px solid #3c4a58;background:#26303b;color:#fff;font-size:18px;line-height:1;padding:0}
.metro{position:relative;display:flex;gap:3px}
.pop{position:absolute;bottom:calc(100% + 6px);inset-inline-start:0;z-index:20;background:#121a22;border:1px solid #3c4a58;border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:8px;min-width:270px;max-width:calc(100vw - 30px);box-shadow:0 8px 20px rgba(0,0,0,.45);font-size:13px}
.pop[hidden]{display:none}
.poprow{display:flex;align-items:center;gap:8px;justify-content:space-between}
.poprow input[type=range]{flex:1;accent-color:var(--led)}
.poprow output{font-family:var(--f-mono);min-width:26px;text-align:end}
.seg{display:flex;border:1px solid #3c4a58;border-radius:6px;overflow:hidden;direction:ltr}
.seg button{background:#1b2027;color:#cdd7e0;border:none;padding:3px 8px;font-family:var(--f-mono);font-size:12px}
.seg button.on{background:var(--led);color:#231503;font-weight:600}

.brand{flex:none;align-self:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding-inline:4px}
.brand img{width:54px;height:54px;border-radius:50%;box-shadow:0 0 0 2px #2c3845,0 2px 6px rgba(0,0,0,.5)}
.brand b{font-family:var(--f-display);font-weight:700;letter-spacing:.12em;color:#e7edf3;font-size:12px;white-space:nowrap}
.savebtn{margin-top:4px;display:flex;align-items:center;gap:5px;background:#26303b;border:1px solid #3c4a58;color:#fff;border-radius:6px;font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;padding:3px 9px;cursor:pointer}
.volbox{display:flex;flex-direction:column;align-items:center;gap:1px;margin-top:4px;font-family:var(--f-mono);font-size:9px;color:var(--panel-dim);letter-spacing:.1em}
.volbox input{direction:ltr;width:72px;accent-color:var(--led);margin:0}
.volbox output{font-size:9px;color:#e7edf3}
.savebtn i{width:6px;height:6px;border-radius:50%;background:#3b2320}
.savebtn.dirty i{background:var(--led);box-shadow:0 0 6px var(--led)}
.savebtn.saved i{background:var(--go);box-shadow:0 0 8px var(--go)}
#scrOct{color:#9fd0ff}
#octLbl{min-width:44px;text-align:center}
.brand small{font-family:var(--f-mono);font-size:9px;letter-spacing:.14em;color:var(--panel-dim);white-space:nowrap}
.brand small.sig{display:block;direction:ltr;font-family:"Playfair Display","Didot","Bodoni MT",Georgia,"Times New Roman",serif;font-style:italic;font-size:11px;letter-spacing:.03em;color:#e2c98f;padding-top:3px;border-top:1px solid rgba(226,201,143,.35);margin-top:1px}
.search{flex:0 1 170px;min-width:110px;background:#1b2027;color:#e3e9ef;border:1px solid #3c4650;border-radius:8px;padding:4px 10px;min-height:36px;font:inherit;font-size:14px}
.search::placeholder{color:#7f8e9b}

.kbwrap{overflow-x:auto;direction:ltr;background:#05080b;border-radius:6px;padding:4px 4px 0}
.kb{position:relative;height:calc(var(--kh) + 6px);--w:38px}
.wk,.bk{position:absolute;top:0;border:none;padding:0;border-radius:0 0 5px 5px}
.wk{width:calc(var(--w) - 2px);height:var(--kh);background:linear-gradient(180deg,var(--ivory) 0 85%,var(--ivory-shade));box-shadow:inset 0 -6px 0 rgba(0,0,0,.08)}
.bk{width:calc(var(--w)*.6);height:calc(var(--kh)*.62);background:linear-gradient(180deg,#2a2c30,var(--ebony) 30%,#1c1d20 88%,#34363a);z-index:2;box-shadow:0 3px 3px rgba(0,0,0,.5)}
.wk .c{position:absolute;bottom:8px;left:0;right:0;text-align:center;font-size:11px;color:#8a8375}
.wk.on{background:linear-gradient(180deg,#f6d9ac,#e2a857)}
.bk.on{background:linear-gradient(180deg,#8a5a17,#c6832c)}
.wk.qt{background:linear-gradient(180deg,#bdeeea,#3fbdb5)}
.wk.you{background:linear-gradient(180deg,#d7e4ff,#6f98f5)!important}
.bk.you{background:linear-gradient(180deg,#1d3f8f,#3d6fe0)!important}
.wk.bad,.bk.bad{background:linear-gradient(180deg,#ffd0cc,#e0483e)!important}
.midipanel{background:#121a22;border:1px solid #2c3845;border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:8px;font-size:13px}
.midipanel[hidden]{display:none}
.mrow{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.mgrid{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:6px 10px;align-items:center}
.mgrid select{background:#1b2027;color:#e3e9ef;border:1px solid #3c4650;border-radius:6px;padding:3px 6px;min-height:32px;min-width:0}
.mhint{color:var(--panel-dim);font-size:12px;flex:1 1 200px}
#midiState.ok{color:var(--go)} #midiState.err{color:#ff8a80}
.screen .score{font-size:12px;font-family:var(--f-mono);direction:ltr}
.screen .score:empty{display:none}
.fb-ok{color:#6ee7a0}.fb-bad{color:#ff8a80}
@media (max-width:760px){.mgrid{grid-template-columns:auto 1fr}}
.bk.qt{background:linear-gradient(180deg,#0c4f4c,#1f9a93)}
.badge{position:absolute;left:50%;transform:translateX(-50%);top:4px;font:600 11px var(--f-mono);background:var(--turq);color:#fff;border-radius:4px;padding:0 3px;white-space:nowrap}
.bk .badge{top:auto;bottom:6px}

/* Phones: compact panel */
@media (max-width:760px), (max-height:620px){
  .panel{gap:6px}
  .scale{padding:3px 4px}
  .mini{zoom:.72}
  .screen{height:78px;padding:4px 8px}
  .screen .now{font-size:19px}
  .hwbtn{min-height:36px;padding:3px 8px}
  .brand img{width:38px;height:38px}
  .brand small{display:none}
  .sheet-title{font-size:14px}
}
@media (max-width:760px) and (orientation:portrait){
  .panel{flex-wrap:wrap}
  .center{order:-1;flex:1 1 100%}
  .scale{flex:1 1 auto;align-items:center}
  .brand{flex-direction:row;gap:8px;flex:1 1 100%;flex-wrap:wrap;justify-content:center}
  .volbox{flex-direction:row;gap:5px;margin-top:0}
  .ctrl{justify-content:center;gap:4px}
  .hwbtn{padding:2px 7px;min-height:34px;gap:4px}
  .hwbtn span{font-size:11px}
  .hwbtn.big{padding-inline:8px}
  .tempo .lbl{font-size:9px;letter-spacing:.04em}
  #octLbl{min-width:34px}
  .tempos{gap:6px}
  .tempo button{width:32px;height:32px}
  .screen{height:78px;gap:0}
  .screen .now{font-size:18px}
  .screen .slow,.screen .score{display:none}
}
/* Phone on its side: notes get most of the height */
@media (max-height:500px) and (orientation:landscape){
  :root{--kh:clamp(70px,22vh,104px)}
  .app{padding-block:4px;gap:4px}
  .organ{padding:5px;gap:5px}
  .screen{height:52px;padding:2px 8px;gap:0}
  .screen .now{font-size:16px}
  .fxb{font-size:9px;padding:0 4px}
  .screen .sub,.screen .slow,.screen .score,.tune{display:none}
  .mini{zoom:.52}
  .scalehead .lbl{display:none}
  .brand b{display:none}
  .brand img{width:32px;height:32px}
  .hwbtn{min-height:30px;padding:2px 7px;font-size:9px}
  .hwbtn span{font-size:11px}
  .tempo button{width:28px;height:28px}
  .sheet-title{display:none} .sheet-note{display:none}
  .standbar select,.attach,.search,.folders button{min-height:30px}
}

<style>
.pwa-box{margin-top:12px;padding:10px 12px;border:1px dashed #c9b48a;border-radius:10px;background:#fbf6ea;font-size:13px;line-height:1.6;color:#4a4232}
.pwa-box button{width:100%;padding:10px;border:0;border-radius:9px;background:#b8925a;color:#fff;font:inherit;font-weight:600;cursor:pointer}
.pwa-box .ios{display:none}.pwa-box.is-ios .ios{display:block}.pwa-box.is-ios button{display:none}
.pwa-ask .stu-card{width:min(380px,100%)}
.pwa-ask .pa-top{display:flex;flex-direction:column;align-items:center;text-align:center;padding:22px 20px 6px;gap:8px}
.pwa-ask .pa-top img{width:84px;height:84px;border-radius:22%;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.pwa-ask .pa-top b{font-size:18px}
.pwa-ask .pa-top small{color:#b8955a;font-style:italic;font-family:'Playfair Display',Georgia,serif}
.pwa-ask .pa-txt{font-size:14.5px;line-height:1.7;color:#3d4450;text-align:center;margin:4px 0 6px}
.pwa-ask ol{margin:6px 0 4px;padding-inline-start:22px;font-size:14.5px;line-height:1.9;color:#1d2430;text-align:right}
.pwa-ask .stu-row{margin-top:12px}
.pwa-ask .stu-row .stu-go{margin-top:0}
</style>
<script>
(function(){
  if('serviceWorker' in navigator && window.isSecureContext){
    window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});
  }
  var standalone=window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
  if(standalone||!window.isSecureContext) return;   // already opened as the installed app, or a saved copy
  var ua=navigator.userAgent, ios=/iPhone|iPad|iPod/.test(ua)||(/Macintosh/.test(ua)&&navigator.maxTouchPoints>1);
  var mobile=ios||/Android|Mobi/i.test(ua), firefoxAndroid=/Android/.test(ua)&&/Firefox\//.test(ua);
  var SNOOZE='orp.pwa.later', DAYS=3;
  var deferred=null, box=null, asked=false;
  function snoozed(){ try{ return +(localStorage.getItem(SNOOZE)||0)>Date.now(); }catch(e){ return false; } }
  function snooze(){ try{ localStorage.setItem(SNOOZE,String(Date.now()+DAYS*864e5)); }catch(e){} }
  function logo(){ var i=document.querySelector('.brand img'); return i?i.src:'icons/icon-192.png'; }
  function busy(){ return [].some.call(document.querySelectorAll('.stu-modal'),function(m){ return !m.hidden&&m.id!=='pwaAsk'; }); }

  /* the question when the link is opened: install / cancel */
  function ask(){
    if(asked||snoozed()||window.ASTUDIO_SHELL||document.getElementById('pwaAsk')) return;
    if(busy()){ setTimeout(ask,1500); return; }
    asked=true;
    var m=document.createElement('div'); m.className='stu-modal pwa-ask'; m.id='pwaAsk'; m.dir='rtl';
    m.setAttribute('role','dialog'); m.setAttribute('aria-modal','true'); m.setAttribute('aria-labelledby','pwaT');
    var body;
    if(deferred) body='<div class="pa-txt">نزّل التطبيق على تلفونك: بيفتح من أيقونة على الشاشة، بشاشة كاملة وبسرعة.</div>'+
      '<div class="stu-row"><button class="stu-go" id="pwaYes">تثبيت</button><button class="stu-go alt" id="pwaNo">إلغاء</button></div>';
    else if(ios) body='<div class="pa-txt">لتثبيت التطبيق على الآيفون:</div><ol>'+
      '<li>اضغط زر المشاركة <b>⬆︎</b> (تحت بـ Safari، أو فوق بـ Chrome)</li><li>اختار <b>Add to Home Screen</b> (إضافة إلى الشاشة الرئيسية)</li><li>اضغط <b>Add</b> (إضافة)</li></ol>'+
      '<div class="stu-row"><button class="stu-go" id="pwaNo">تمام</button></div>';
    else body='<div class="pa-txt">لتثبيت التطبيق: افتح قائمة المتصفح <b>⋮</b> واختار <b>Install</b> أو <b>Add to Home screen</b>.</div>'+
      '<div class="stu-row"><button class="stu-go" id="pwaNo">تمام</button></div>';
    m.innerHTML='<div class="stu-card"><div class="pa-top"><img alt="" src="'+logo()+'"><b id="pwaT">A STUDIO</b><small>By. Ayman Abohelal</small></div><div class="stu-body">'+body+'</div></div>';
    document.body.appendChild(m);
    var yes=document.getElementById('pwaYes'), no=document.getElementById('pwaNo');
    function close(){ m.remove(); }
    no.onclick=function(){ snooze(); close(); };
    m.addEventListener('click',function(e){ if(e.target===m){ snooze(); close(); } });
    if(yes){ yes.focus(); yes.onclick=function(){ close(); install(); }; } else no.focus();
  }
  function install(){
    if(!deferred) return; var d=deferred; deferred=null; d.prompt();
    d.userChoice.then(function(c){ if(c&&c.outcome!=='accepted') snooze(); }).catch(function(){});
    if(box){ box.remove(); box=null; }
  }

  /* the same option inside the login card, for whoever cancelled earlier */
  function inLogin(){
    var b=document.querySelector('#stuLogin .stu-body'); if(!b||box||!(deferred||ios)) return;
    box=document.createElement('div'); box.className='pwa-box'+(ios&&!deferred?' is-ios':'');
    box.innerHTML='<button type="button">📲 ثبّت التطبيق على التلفون</button>'+
      '<div class="ios">📲 لتثبيت التطبيق: زر المشاركة <b>⬆︎</b> ← <b>Add to Home Screen</b>.</div>';
    box.querySelector('button').onclick=install; b.appendChild(box);
  }

  window.addEventListener('beforeinstallprompt',function(e){ e.preventDefault(); deferred=e; inLogin(); if(mobile) setTimeout(ask,900); });
  window.addEventListener('appinstalled',function(){ deferred=null; var m=document.getElementById('pwaAsk'); if(m) m.remove(); if(box){ box.remove(); box=null; } });
  function ready(){ inLogin(); if(ios||firefoxAndroid) setTimeout(ask,1200); }
  document.readyState==='loading'?document.addEventListener('DOMContentLoaded',ready):ready();
})();
</script>
